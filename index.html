<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FF6B4A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Poe Math">
  <meta name="description" content="Simple multiplication flashcards for Presley.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Poe's Times Tables</title>
  <style>
    :root {
      --sun: #FFF4D6;
      --sun-deep: #FFE8B0;
      --card: #FFFFFF;
      --ink: #2C2A32;
      --muted: #6B6574;
      --coral: #FF6B4A;
      --coral-dark: #E85536;
      --teal: #2EB8A0;
      --teal-dark: #229982;
      --gold: #FFD166;
      --violet: #7B6CFF;
      --ok: #2FA36A;
      --ok-bg: #E5F8EE;
      --soft: #FFF0E4;
      --miss: #E8893A;
      --shadow: 0 8px 24px rgba(44, 42, 50, 0.12);
      --radius: 22px;
      --tap: 56px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--sun);
      color: var(--ink);
      font-family: ui-rounded, "Segoe UI", system-ui, Roboto, "Helvetica Neue", sans-serif;
    }
    body {
      min-height: 100dvh;
      overflow-x: hidden;
    }
    button, .chip {
      font: inherit;
      color: inherit;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .app {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100dvh;
      padding: calc(12px + var(--safe-top)) 16px calc(16px + var(--safe-bottom));
      display: flex;
      flex-direction: column;
      position: relative;
    }

    header.top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 48px;
      margin-bottom: 8px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .logo {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--coral);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 22px;
      flex-shrink: 0;
    }
    h1 {
      margin: 0;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }
    .sub {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .icon-btn {
      min-width: var(--tap);
      min-height: var(--tap);
      border: 0;
      background: transparent;
      border-radius: 16px;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--muted);
      padding: 8px 8px;
    }
    .icon-btn:hover, .icon-btn:focus-visible { background: rgba(255,255,255,0.6); outline: none; }

    .screen { display: none; flex: 1; flex-direction: column; }
    .screen.active { display: flex; }

    .panel {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px 16px;
      margin-top: 10px;
    }
    .label {
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 10px;
    }
    .row { margin-bottom: 18px; }
    .row:last-child { margin-bottom: 0; }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .chip, .choice {
      min-height: var(--tap);
      min-width: var(--tap);
      border: 2px solid transparent;
      border-radius: 16px;
      background: var(--sun);
      font-weight: 800;
      font-size: 1.1rem;
      padding: 0 14px;
    }
    .chip[aria-pressed="true"], .choice[aria-pressed="true"] {
      background: var(--teal);
      color: #fff;
    }
    .chip:focus-visible, .choice:focus-visible, .primary:focus-visible, .secondary:focus-visible, .key:focus-visible {
      outline: 3px solid var(--violet);
      outline-offset: 2px;
    }
    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .choices.three { grid-template-columns: 1fr 1fr 1fr; }
    .choice {
      width: 100%;
      font-size: 0.95rem;
      padding: 8px 10px;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: var(--tap);
    }
    .switch {
      position: relative;
      width: 64px;
      height: 36px;
      flex-shrink: 0;
      border: 0;
      border-radius: 999px;
      background: #ddd6cc;
      padding: 0;
    }
    .switch[aria-pressed="true"] { background: var(--teal); }
    .switch::after {
      content: "";
      position: absolute;
      top: 4px;
      left: 4px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.15s ease;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }
    .switch[aria-pressed="true"]::after { transform: translateX(28px); }

    .primary, .secondary {
      min-height: 60px;
      width: 100%;
      border: 0;
      border-radius: 18px;
      font-weight: 800;
      font-size: 1.15rem;
      margin-top: 12px;
    }
    .primary {
      background: var(--coral);
      color: #fff;
      box-shadow: 0 6px 0 var(--coral-dark);
    }
    .primary:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 3px 0 var(--coral-dark); }
    .secondary {
      background: var(--sun-deep);
      color: var(--ink);
      box-shadow: none;
    }
    .actions { margin-top: auto; padding-top: 12px; }

    .progress-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 4px 0 12px;
      font-weight: 700;
      color: var(--muted);
    }
    .bar {
      flex: 1;
      height: 10px;
      background: #ffe2b8;
      border-radius: 999px;
      overflow: hidden;
    }
    .bar > span {
      display: block;
      height: 100%;
      width: 0%;
      background: var(--teal);
      border-radius: inherit;
      transition: width 0.2s ease;
    }

    .flash {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .card {
      width: 100%;
      min-height: 200px;
      background: var(--card);
      border-radius: 28px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      border: 0;
      cursor: pointer;
    }
    .card[aria-disabled="true"] { cursor: default; }
    .prompt {
      font-size: clamp(3.2rem, 18vw, 5.2rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
    }
    .hint {
      margin-top: 12px;
      color: var(--muted);
      font-weight: 650;
      font-size: 1rem;
    }
    .answer {
      margin-top: 10px;
      font-size: clamp(2.6rem, 14vw, 4rem);
      font-weight: 800;
      color: var(--teal-dark);
      min-height: 1.1em;
    }
    .typed {
      margin-top: 8px;
      min-height: 1.15em;
      font-size: clamp(2.4rem, 13vw, 3.6rem);
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--ink);
    }
    .typed.placeholder { color: #c9c2b6; }
    .feedback {
      min-height: 1.6em;
      margin: 10px 0 0;
      font-weight: 800;
      font-size: 1.05rem;
      line-height: 1.3;
    }
    .feedback.ok { color: var(--ok); }
    .feedback.again { color: var(--miss); }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 8px;
    }
    .key {
      min-height: 60px;
      border: 0;
      border-radius: 16px;
      background: var(--card);
      box-shadow: var(--shadow);
      font-size: 1.6rem;
      font-weight: 800;
    }
    .key.wide-action { background: var(--teal); color: #fff; }
    .key.back { background: var(--sun-deep); font-size: 1.3rem; }
    .key.ghost { background: transparent; box-shadow: none; pointer-events: none; }
    .flip-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      width: 100%;
      margin-top: 14px;
    }
    .got-it { background: var(--teal); color: #fff; box-shadow: 0 5px 0 var(--teal-dark); }
    .got-it:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 3px 0 var(--teal-dark); }
    .try-again { background: var(--gold); color: var(--ink); }

    .score {
      text-align: center;
      padding: 8px 0 4px;
    }
    .score .big {
      font-size: clamp(3rem, 16vw, 4.4rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
    }
    .score p { margin: 8px 0 0; font-size: 1.15rem; font-weight: 700; }
    .missed-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .missed-list li {
      background: var(--soft);
      border-radius: 999px;
      padding: 10px 14px;
      font-weight: 800;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
    }
    .empty-note { color: var(--muted); font-weight: 650; margin: 0; }

    .celebrate { animation: pop 0.35s ease; }
    @keyframes pop {
      0% { transform: scale(0.92); }
      60% { transform: scale(1.04); }
      100% { transform: scale(1); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }
    @keyframes toast-in {
      from { opacity: 0; transform: translate(-50%, -8px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }

    .pin-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding-top: 8px;
    }
    .pin-dots {
      display: flex;
      gap: 14px;
      margin: 18px 0 8px;
    }
    .pin-dots span {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 3px solid var(--coral);
      background: transparent;
    }
    .pin-dots span.filled { background: var(--coral); }
    .pin-dots.shake { animation: shake 0.35s ease; }
    .pin-error {
      min-height: 1.4em;
      color: var(--miss);
      font-weight: 700;
      margin: 0 0 8px;
    }
    #pinKeypad { width: 100%; max-width: 340px; }

    .toast {
      position: absolute;
      left: 50%;
      top: calc(58px + var(--safe-top));
      transform: translate(-50%, 0);
      width: calc(100% - 24px);
      max-width: 400px;
      background: var(--card);
      color: var(--ink);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 12px 14px 12px 16px;
      display: none;
      align-items: center;
      gap: 10px;
      z-index: 40;
      font-weight: 800;
      line-height: 1.3;
      text-align: left;
    }
    .toast.show { display: flex; animation: toast-in 0.2s ease; }
    .toast.streak {
      background: var(--violet);
      color: #fff;
    }
    .toast .deco {
      font-size: 1.5rem;
      flex-shrink: 0;
    }
    .toast p { margin: 0; }

    .sticker-count {
      text-align: center;
      font-weight: 800;
      margin: 4px 0 12px;
      color: var(--muted);
    }
    .sticker-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding-bottom: 8px;
    }
    .sticker-card {
      background: var(--card);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 14px 10px 12px;
      text-align: center;
      min-height: 150px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .sticker-card h3 {
      margin: 0;
      font-size: 0.92rem;
      line-height: 1.2;
    }
    .sticker-card p {
      margin: 0;
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 650;
      line-height: 1.3;
    }
    .badge {
      width: 78px;
      height: 78px;
      border-radius: 22px;
      display: grid;
      place-items: center;
      font-size: 2rem;
      box-shadow: 0 5px 0 rgba(44, 42, 50, 0.12);
      position: relative;
      flex-shrink: 0;
    }
    .badge svg { width: 34px; height: 34px; display: block; }
    .badge.locked {
      background: #e7e0d4 !important;
      filter: grayscale(1);
      opacity: 0.55;
      box-shadow: none;
    }
    .sticker-card.locked h3 { color: var(--muted); }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(44, 42, 50, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 60;
    }
    .modal.show { display: flex; }
    .modal-card {
      background: var(--card);
      border-radius: 28px;
      padding: 24px 18px 18px;
      width: min(360px, 100%);
      text-align: center;
      box-shadow: var(--shadow);
    }
    .modal-card h2 { margin: 12px 0 4px; font-size: 1.4rem; }
    .modal-card p { margin: 0 0 8px; font-weight: 700; }
    .modal-arts {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 6px;
    }

    #confetti {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 70;
      display: none;
    }

    @media (max-height: 700px) {
      .card { min-height: 160px; padding: 16px; }
      .prompt { font-size: clamp(2.6rem, 14vw, 4rem); }
      .key { min-height: 56px; }
      .badge { width: 68px; height: 68px; font-size: 1.7rem; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <div class="logo" aria-hidden="true">×</div>
        <div>
          <h1>Poe's Times Tables</h1>
          <p class="sub" id="subtitle">Pick your tables and go</p>
        </div>
      </div>
      <button type="button" class="icon-btn" id="stickersBtn" hidden>Stickers</button>
      <button type="button" class="icon-btn" id="backBtn" hidden>Setup</button>
    </header>

    <section class="screen" id="pinScreen" aria-label="Secret code">
      <div class="pin-wrap">
        <p class="label">Secret code</p>
        <div class="pin-dots" id="pinDots" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
        </div>
        <p class="pin-error" id="pinError">&nbsp;</p>
        <div id="pinKeypad" class="keypad"></div>
      </div>
    </section>

    <section class="screen" id="setupScreen" aria-label="Setup">
      <div class="panel">
        <div class="row">
          <p class="label">Tables</p>
          <div class="chips" id="tableChips"></div>
        </div>
        <div class="row">
          <p class="label">Mode</p>
          <div class="choices">
            <button type="button" class="choice" id="modeFlip" aria-pressed="true">Flip cards</button>
            <button type="button" class="choice" id="modeType" aria-pressed="false">Type answer</button>
          </div>
        </div>
        <div class="row">
          <p class="label">Round</p>
          <div class="choices three">
            <button type="button" class="choice" data-round="10" aria-pressed="false">10</button>
            <button type="button" class="choice" data-round="20" aria-pressed="true">20</button>
            <button type="button" class="choice" data-round="all" aria-pressed="false">All</button>
          </div>
        </div>
        <div class="row">
          <div class="toggle-row">
            <span style="font-weight:800">Sound</span>
            <button type="button" class="switch" id="soundToggle" aria-pressed="false" aria-label="Sound off"></button>
          </div>
        </div>
      </div>
      <div class="actions">
        <button type="button" class="primary" id="startBtn">Start practice</button>
        <button type="button" class="secondary" id="setupStickersBtn">My Stickers</button>
      </div>
    </section>

    <section class="screen" id="playScreen" aria-label="Practice">
      <div class="progress-wrap">
        <div class="bar" aria-hidden="true"><span id="progressBar"></span></div>
        <span id="progressText">0 / 20</span>
      </div>
      <div class="flash">
        <button type="button" class="card" id="flashCard" aria-live="polite">
          <div class="prompt" id="prompt">7 × 8</div>
          <div class="hint" id="cardHint">Tap to see the answer</div>
          <div class="answer" id="revealed" hidden></div>
          <div class="typed placeholder" id="typed" hidden>?</div>
        </button>
        <p class="feedback" id="feedback" aria-live="polite"></p>
      </div>
      <div id="flipActions" class="flip-actions" hidden>
        <button type="button" class="primary try-again" id="againBtn">Practice again</button>
        <button type="button" class="primary got-it" id="gotItBtn">Got it</button>
      </div>
      <div id="keypad" class="keypad" hidden></div>
    </section>

    <section class="screen" id="endScreen" aria-label="Results">
      <div class="score">
        <div class="big" id="scoreBig">18 / 20</div>
        <p id="scoreMessage">Nice work, Poe!</p>
      </div>
      <div class="panel">
        <p class="label">Facts to work on</p>
        <ul class="missed-list" id="missedList"></ul>
        <p class="empty-note" id="noMissed" hidden>You got every one. Awesome!</p>
      </div>
      <div class="actions">
        <button type="button" class="primary" id="playAgainBtn">Play again</button>
        <button type="button" class="secondary" id="missedOnlyBtn">Practice missed only</button>
        <button type="button" class="secondary" id="endStickersBtn">My Stickers</button>
      </div>
    </section>

    <section class="screen" id="stickerScreen" aria-label="My Stickers">
      <p class="sticker-count" id="stickerCount">0 / 20 collected</p>
      <div class="sticker-grid" id="stickerGrid"></div>
    </section>

    <div class="toast" id="cheerToast" role="status">
      <span class="deco" id="cheerDeco" aria-hidden="true">★</span>
      <p id="cheerText"></p>
    </div>
  </div>
  <div class="modal" id="unlockPop" role="dialog" aria-labelledby="unlockTitle">
    <div class="modal-card">
      <div class="modal-arts" id="unlockArts"></div>
      <h2 id="unlockTitle">New sticker!</h2>
      <p id="unlockName"></p>
      <button type="button" class="primary" id="unlockOk">Yay!</button>
    </div>
  </div>
  <canvas id="confetti"></canvas>

      function loadSettings() {
        try {
          const raw = JSON.parse(localStorage.getItem(SETTINGS_KEY));
          if (!raw) return { ...DEFAULTS, tables: DEFAULTS.tables.slice() };
          const tables = Array.isArray(raw.tables)
            ? raw.tables.map(Number).filter((n) => n >= 1 && n <= 10)
            : DEFAULTS.tables.slice();
          return {
            tables: tables.length ? [...new Set(tables)].sort((a, b) => a - b) : DEFAULTS.tables.slice(),
            mode: raw.mode === "type" ? "type" : "flip",
            round: raw.round === 10 || raw.round === "all" ? raw.round : 20,
            sound: !!raw.sound
          };
        } catch (e) {
          return { ...DEFAULTS, tables: DEFAULTS.tables.slice() };
        }
      }

      function saveSettings() {
        localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
      }

      function loadTally() {
        try { return JSON.parse(localStorage.getItem(TALLY_KEY)) || {}; }
        catch (e) { return {}; }
      }

      function saveTally() {
        localStorage.setItem(TALLY_KEY, JSON.stringify(tally));
      }

      function emptyRewards() {
        return { unlocked: {}, totalCorrect: 0, bestStreak: 0, perfectRounds: 0, masteredFacts: [] };
      }

      function loadRewards() {
        try {
          const raw = JSON.parse(localStorage.getItem(REWARDS_KEY)) || {};
          return {
            unlocked: raw.unlocked && typeof raw.unlocked === "object" ? raw.unlocked : {},
            totalCorrect: Number(raw.totalCorrect) || 0,
            bestStreak: Number(raw.bestStreak) || 0,
            perfectRounds: Number(raw.perfectRounds) || 0,
            masteredFacts: Array.isArray(raw.masteredFacts) ? raw.masteredFacts.slice() : []
          };
        } catch (e) {
          return emptyRewards();
        }
      }

      function saveRewards() {
        localStorage.setItem(REWARDS_KEY, JSON.stringify(rewards));
      }

      function factKey(card) { return card.a + "×" + card.b; }
      function factLabel(card) { return card.a + " × " + card.b; }
      function product(card) { return card.a * card.b; }

      function shuffle(list) {
        const arr = list.slice();
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const tmp = arr[i];
          arr[i] = arr[j];
          arr[j] = tmp;
        }
        return arr;
      }

      function pick(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
      }

      function flattenLines(key) {
        const lines = [];
        FAVORITE_ARTISTS.forEach((artist) => {
          (artist[key] || []).forEach((text) => lines.push(text));
        });
        return lines;
      }

      function pickCheer() { return pick(flattenLines("cheers")); }
      function pickEncouragement() { return pick(flattenLines("encouragements")); }

      function stickerById(id) {
        return STICKERS.find((s) => s.id === id);
      }

      function buildFacts(tables) {
        const facts = [];
        tables.forEach((a) => {
          for (let b = 1; b <= 10; b++) facts.push({ a: a, b: b });
        });
        return facts;
      }

      function buildRound(sourceFacts, size) {
        const pool = shuffle(sourceFacts.map((f) => ({ a: f.a, b: f.b, missed: false })));
        if (size === "all" || pool.length <= size) return pool;
        return pool.slice(0, size);
      }

      function requeue(card) {
        const copy = { a: card.a, b: card.b, missed: true };
        if (queue.length === 0) {
          queue.push(copy);
          return;
        }
        const minLater = Math.min(2, queue.length);
        const maxLater = queue.length;
        const offset = minLater + Math.floor(Math.random() * (maxLater - minLater + 1));
        queue.splice(offset, 0, copy);
      }

        if (name === "pin") subtitle.textContent = "Enter the secret code";
        if (name === "setup") subtitle.textContent = "Pick your tables and go";

        if (name === "end") subtitle.textContent = "Round complete";
        if (name === "stickers") subtitle.textContent = "My Stickers";

      function renderSetup() {

            } else {
              settings.tables.push(n);
              settings.tables.sort((a, b) => a - b);
            }
            saveSettings();
            renderSetup();
          });

        $("modeFlip").setAttribute("aria-pressed", settings.mode === "flip" ? "true" : "false");

        });

      soundToggle.addEventListener("click", () => {
        settings.sound = !settings.sound;

      function unlockAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
      }

      function playTone(kind) {
        if (!settings.sound) return;
        try {
          unlockAudio();
          const now = audioCtx.currentTime;
          const notes = kind === "ok" ? [523.25, 659.25, 783.99] : kind === "unlock" ? [523.25, 659.25, 783.99, 1046.5] : [392.0, 329.63];
          notes.forEach((freq, i) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "sine";
            osc.frequency.value = freq;
            const start = now + i * 0.09;
            gain.gain.setValueAtTime(0.0001, start);
            gain.gain.exponentialRampToValueAtTime(0.08, start + 0.03);
            gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.22);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(start);
            osc.stop(start + 0.24);
          });
        } catch (e) {}
      }

      function startRound(sourceFacts, size) {
        deck = buildRound(sourceFacts, size === undefined ? settings.round : size);
        if (deck.length === 0) return;
        queue = deck.slice();

        firstTryCorrect = 0;
        missedFacts = [];

      function markMissed() {
        const key = factKey(current);
        tally[key] = (tally[key] || 0) + 1;
        saveTally();
        currentStreak = 0;
        if (!current.missed) {
          current.missed = true;
          if (!missedFacts.some((f) => f.a === current.a && f.b === current.b)) {
            missedFacts.push({ a: current.a, b: current.b });
          }
        }
      }

      function markGotIt() {
        if (!current.missed) firstTryCorrect += 1;
        done += 1;
        updateProgress();

      function unlockIfNeeded(ids) {
        const fresh = [];
        const now = new Date().toISOString();
        ids.forEach((id) => {
          if (id && !rewards.unlocked[id]) {
            rewards.unlocked[id] = now;
            fresh.push(id);
          }
        });
        if (fresh.length) saveRewards();
        return fresh;
      }

      function tableMastered(n) {
        for (let b = 1; b <= 10; b++) {
          if (rewards.masteredFacts.indexOf(n + "×" + b) === -1) return false;
        }
        return true;
      }

      function applyCorrectRewards() {
        currentStreak += 1;
        rewards.totalCorrect += 1;
        if (currentStreak > rewards.bestStreak) rewards.bestStreak = currentStreak;
        const key = factKey(current);
        if (rewards.masteredFacts.indexOf(key) === -1) rewards.masteredFacts.push(key);
        const ids = [];
        if (rewards.totalCorrect >= 1) ids.push("first-note");
        if (currentStreak >= 3) ids.push("streak-3");
        if (currentStreak >= 5) ids.push("streak-5");
        if (currentStreak >= 10) ids.push("streak-10");
        if (rewards.totalCorrect >= 10) ids.push("correct-10");
        if (rewards.totalCorrect >= 25) ids.push("correct-25");
        if (rewards.totalCorrect >= 50) ids.push("correct-50");
        if (rewards.totalCorrect >= 100) ids.push("correct-100");
        if (tableMastered(current.a)) ids.push("table-" + current.a);
        saveRewards();
        return unlockIfNeeded(ids);
      }

      function burstConfetti() {
        const canvas = $("confetti");
        const ctx = canvas.getContext("2d");
        const w = canvas.width = window.innerWidth;
        const h = canvas.height = window.innerHeight;
        const colors = ["#FF6B4A", "#2EB8A0", "#FFD166", "#7B6CFF", "#F06292", "#FFFFFF"];
        const bits = [];
        for (let i = 0; i < 90; i++) {
          bits.push({
            x: Math.random() * w,
            y: -20 - Math.random() * h * 0.3,
            s: 6 + Math.random() * 8,
            vy: 3 + Math.random() * 5,
            vx: -2 + Math.random() * 4,
            rot: Math.random() * 6,
            vr: -0.2 + Math.random() * 0.4,
            color: colors[i % colors.length],
            round: Math.random() > 0.5
          });
        }
        canvas.style.display = "block";
        const start = performance.now();
        function frame(now) {
          const t = now - start;
          ctx.clearRect(0, 0, w, h);
          bits.forEach((b) => {
            b.x += b.vx;
            b.y += b.vy;
            b.rot += b.vr;
            ctx.save();
            ctx.translate(b.x, b.y);
            ctx.rotate(b.rot);
            ctx.fillStyle = b.color;
            if (b.round) {
              ctx.beginPath();
              ctx.arc(0, 0, b.s / 2, 0, Math.PI * 2);
              ctx.fill();
            } else {
              ctx.fillRect(-b.s / 2, -b.s / 3, b.s, b.s * 0.6);
            }
            ctx.restore();
          });
          if (t < 1600) requestAnimationFrame(frame);
          else {
            ctx.clearRect(0, 0, w, h);
            canvas.style.display = "none";
          }
        }
        requestAnimationFrame(frame);
      }

          burstConfetti();

            resolve();

        if (fresh.length) {
          showUnlock(fresh).then(nextCard);
        } else {
          showCheer(special ? streakLine(currentStreak) : pickCheer(), special);
          setTimeout(nextCard, special ? 1300 : 950);

        if (locked || !revealedOn) return;
        locked = true;

        markMissed();
        requeue(current);
        afterMiss();

      function renderKeypad() {
        keypad.innerHTML = "";
        const keys = ["1","2","3","4","5","6","7","8","9","back","0","go"];
        keys.forEach((k) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "key";
          if (k === "back") {
            btn.classList.add("back");
            btn.textContent = "⌫";
            btn.setAttribute("aria-label", "Backspace");
          } else if (k === "go") {
            btn.classList.add("wide-action");
            btn.textContent = "✓";
            btn.setAttribute("aria-label", "Check answer");
          } else {
            btn.textContent = k;
          }
          btn.addEventListener("click", () => onKey(k));
          keypad.appendChild(btn);
        });
      }

      function onKey(k) {
        if (settings.mode !== "type" || locked || !current) return;
        if (k === "back") {
          typed = typed.slice(0, -1);
        } else if (k === "go") {
          checkTyped();
          return;
        } else if (typed.length < 3) {
          typed += k;
        }
        typedEl.classList.toggle("placeholder", typed.length === 0);
        typedEl.textContent = typed.length ? typed : "?";
      }

      function checkTyped() {
        if (!typed) return;
        const value = Number(typed);
        const answer = product(current);
        locked = true;
        if (value === answer) {
          playTone("ok");
          afterCorrect("Yes! " + factLabel(current) + " = " + answer);
        } else {
          playTone("again");
          markMissed();
          requeue(current);
          typedEl.textContent = String(answer);
          typedEl.classList.remove("placeholder");
          afterMiss("It's " + answer + ".");
        }
      }

      function finishRound() {
        const perfect = total > 0 && firstTryCorrect === total;
        if (perfect) {
          rewards.perfectRounds += 1;
          saveRewards();
          const fresh = unlockIfNeeded(["perfect-round"].concat(rewards.perfectRounds >= 3 ? ["perfect-3"] : []));
          if (fresh.length) showUnlock(fresh);
        }
        showScreen("end");
        $("scoreBig").textContent = firstTryCorrect + " / " + total;
        const ratio = total ? firstTryCorrect / total : 1;
        let message = "Nice work, Poe!";
        if (total === 0) message = "Ready when you are.";
        else if (perfect) message = "What Makes You Beautiful — a perfect round!";
        else if (ratio >= 0.8) message = "Great practice, Poe! How It's Done.";
        else message = "Good effort, Poe. Little Things count.";
        $("scoreMessage").textContent = message;

        const list = $("missedList");
        const empty = $("noMissed");
        list.innerHTML = "";
        if (missedFacts.length === 0) {
          empty.hidden = false;
          $("missedOnlyBtn").hidden = true;
        } else {
          empty.hidden = true;
          $("missedOnlyBtn").hidden = false;
          missedFacts
            .slice()
            .sort((x, y) => (tally[factKey(y)] || 0) - (tally[factKey(x)] || 0) || x.a - y.a || x.b - y.b)
            .forEach((f) => {
              const li = document.createElement("li");
              li.textContent = factLabel(f) + " = " + (f.a * f.b);
              list.appendChild(li);
            });
        }
      }

      function renderStickers() {
        const got = STICKERS.filter((s) => rewards.unlocked[s.id]).length;
        $("stickerCount").textContent = got + " / " + STICKERS.length + " collected";
        const grid = $("stickerGrid");
        grid.innerHTML = "";
        STICKERS.forEach((s) => {
          const locked = !rewards.unlocked[s.id];
          const card = document.createElement("div");
          card.className = "sticker-card" + (locked ? " locked" : "");
          card.appendChild(makeBadge(s, locked));
          const h = document.createElement("h3");
          h.textContent = locked ? "???" : s.name;
          const p = document.createElement("p");
          p.textContent = locked ? s.hint : "Unlocked!";
          card.appendChild(h);
          card.appendChild(p);
          grid.appendChild(card);
        });
      }

      function openStickers(from) {
        stickerReturn = from || lastScreen || "setup";
        renderStickers();
        showScreen("stickers");
      }

      startBtn.addEventListener("click", () => {
        if (settings.sound) unlockAudio();
        startRound(buildFacts(settings.tables));
      });
      $("playAgainBtn").addEventListener("click", () => {
        startRound(buildFacts(settings.tables));
      });
      $("missedOnlyBtn").addEventListener("click", () => {
        if (!missedFacts.length) return;
        startRound(missedFacts.slice(), "all");
      });
      backBtn.addEventListener("click", () => {
        if (stickerScreen.classList.contains("active")) showScreen(stickerReturn || "setup");
        else showScreen("setup");
      });
      stickersBtn.addEventListener("click", () => openStickers("setup"));
      $("setupStickersBtn").addEventListener("click", () => openStickers("setup"));
      $("endStickersBtn").addEventListener("click", () => openStickers("end"));

      async function hashPin(pin) {
        const data = new TextEncoder().encode(PIN_SALT + pin);
        const buf = await crypto.subtle.digest("SHA-256", data);
        return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
      }

      function isUnlocked() {
        try { return localStorage.getItem(PIN_KEY) === PIN_HASH; }
        catch (e) { return false; }
      }

      function renderPinDots() {
        const dots = $("pinDots").querySelectorAll("span");
        dots.forEach((dot, i) => dot.classList.toggle("filled", i < pinValue.length));
      }

      function renderPinKeypad() {
        const box = $("pinKeypad");
        box.innerHTML = "";
        const keys = ["1","2","3","4","5","6","7","8","9","ghost","0","back"];
        keys.forEach((k) => {
          const btn = document.createElement("button");
          btn.type = "button";
          if (k === "ghost") {
            btn.className = "key ghost";
            btn.tabIndex = -1;
            btn.setAttribute("aria-hidden", "true");
          } else if (k === "back") {
            btn.className = "key back";
            btn.textContent = "⌫";
            btn.setAttribute("aria-label", "Backspace");
            btn.addEventListener("click", () => onPinKey("back"));
          } else {
            btn.className = "key";
            btn.textContent = k;
            btn.addEventListener("click", () => onPinKey(k));
          }
          box.appendChild(btn);
        });
      }

      async function onPinKey(k) {
        if (pinBusy) return;
        $("pinError").innerHTML = "&nbsp;";
        if (k === "back") {
          pinValue = pinValue.slice(0, -1);
          renderPinDots();
          return;
        }
        if (pinValue.length >= 4) return;
        pinValue += k;
        renderPinDots();
        if (pinValue.length === 4) {
          pinBusy = true;
          try {
            const hashed = await hashPin(pinValue);
            if (hashed === PIN_HASH) {
              localStorage.setItem(PIN_KEY, PIN_HASH);
              enterApp();
            } else {
              $("pinError").textContent = "Not quite. Try again.";
              $("pinDots").classList.remove("shake");
              void $("pinDots").offsetWidth;
              $("pinDots").classList.add("shake");
              pinValue = "";
              renderPinDots();
            }
          } catch (e) {
            $("pinError").textContent = "Can't check the code offline in this browser.";
          }
          pinBusy = false;
        }
      }

      function enterApp() {
        renderKeypad();
        renderSetup();
        showScreen("setup");
      }

      renderPinKeypad();
      renderPinDots();
      if (isUnlocked()) enterApp();
      else showScreen("pin");

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch(() => {});
        });
      }
    })();
  </script>
</body>
</html>
